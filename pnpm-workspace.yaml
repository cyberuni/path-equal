packages:
  - '!packages/uni-path'
  - packages/*
allowBuilds:
  # size-limit's estimator. `@swc/core`, `core-js` and `unrs-resolver` left with jest
  # and eslint; nothing in the tree pulls them any more.
  esbuild: true
overrides:
  cross-spawn@<6.0.6: '>=6.0.6'
  minimatch@<3.1.4: '>=3.1.4 <4'
  minimatch@>=9.0.0 <9.0.7: '<11'
  lodash@<4.17.24: '>=4.17.24'
  brace-expansion@<1.1.13: '<6'
  tmp@<0.2.6: '>=0.2.6'
  # Dev-tree advisories with no upgrade path: every parent is already on its latest
  # release, so bumping a direct dependency reaches none of them. `path-equal` declares no
  # runtime dependencies, so none of this ships to consumers — Dependabot's `runtime`
  # scope describes the dependency's role in its own parent, not in the published tarball.
  # Drop each line once the tree resolves past it on its own.
  # GHSA-mwcw-c2x4-8c55 (nanoid), via vite/vitest
  nanoid@<3.3.18: '>=3.3.18 <4'
  # GHSA-7q2j-79x2-r6qw (js-yaml), via depcheck. Replaces an older `>=3.0.0 <3.15.0`
  # entry that no longer matched anything in the tree.
  js-yaml@<4.3.1: '>=4.3.1 <5'
  # GHSA-cvhw-v6h6-4wpc (fast-uri), via ajv
  fast-uri@<3.1.5: '>=3.1.5 <4'
  # GHSA-7fh5-64p2-3v2j (postcss), via vite
  postcss@<8.5.23: '>=8.5.23 <9'
  # GHSA-v6h2-p8h4-qcjw (brace-expansion), via glob/minimatch
  brace-expansion@>=2.0.0 <2.1.4: '>=2.1.4 <3'

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
#
# This must live here, not in .npmrc. pnpm only auto-enables STRICT soak mode when
# the setting comes from pnpm-workspace.yaml / config.yaml / CLI / env; a value in
# .npmrc runs in LOOSE mode, where a too-young package is silently appended to
# minimumReleaseAgeExclude and installed anyway. minimumReleaseAgeStrict is set
# explicitly so the enforcement does not depend on that inference.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
